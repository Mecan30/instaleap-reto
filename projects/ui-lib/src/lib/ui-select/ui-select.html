
<div class="ui-select">
  @if (label()) {
    <label [for]="selectElementId" class="ui-select__label">
      {{ label() }}
    </label>
  }

  <div class="ui-select__control-wrapper">
    @if (loading()) {
      <div
        class="ui-select__skeleton"
        role="status"
        aria-live="polite"
        aria-label="Cargando opciones"
      >
        <span class="ui-select__spinner" aria-hidden="true"></span>
        <span class="ui-select__skeleton-text">Cargando...</span>
      </div>
    } @else {
      <select
        [id]="selectElementId"
        class="ui-select__field"
        [disabled]="isInteractionBlocked()"
        [value]="value() ?? ''"
        (change)="onSelectionChange($event)"
      >
        <option value="" disabled [selected]="!value()">
          {{ placeholder() }}
        </option>

        @for (option of options(); track option.value) {
          <option
            [value]="option.value"
            [selected]="value() === option.value"
          >
            {{ option.label }}
          </option>
        }
      </select>
    }
  </div>
</div>
